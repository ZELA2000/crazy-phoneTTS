name: 🐛 Bug Report
description: Segnala un bug o un problema nel sistema TTS
title: "[BUG] "
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Grazie per aver preso il tempo di segnalare questo bug! 
        Compila il form seguente per aiutarci a risolvere il problema.

  - type: textarea
    id: description
    attributes:
      label: Descrizione del problema
      description: Una descrizione chiara e concisa del bug
      placeholder: Descrivi cosa non funziona...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Passi per riprodurre
      description: Come possiamo riprodurre questo problema?
      placeholder: |
        1. Vai su '...'
        2. Clicca su '...'
        3. Inserisci il testo '...'
        4. Vedi l'errore
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamento atteso
      description: Cosa ti aspettavi che succedesse?
      placeholder: Descrivi il comportamento corretto...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportamento attuale
      description: Cosa succede invece?
      placeholder: Descrivi cosa sta succedendo...
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Componente interessato
      description: Quale parte del sistema è affetta dal bug?
      options:
        - Frontend (Interfaccia React)
        - Backend (API FastAPI)
        - TTS Service (Azure/Edge/Google)
        - Audio Processing (Mixaggio/Normalizzazione)
        - Music Library (Gestione musica)
        - Docker/Deployment
        - Update System
        - Altro
    validations:
      required: true

  - type: dropdown
    id: tts-service
    attributes:
      label: Servizio TTS utilizzato
      description: Quale servizio TTS stavi usando quando si è verificato il problema?
      options:
        - Azure Speech
        - Edge TTS
        - Google TTS
        - Non applicabile
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Log e messaggi di errore
      description: Copia qui eventuali log, traceback o messaggi di errore
      placeholder: |
        Incolla i log qui...
      render: shell
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Ambiente
      description: Informazioni sul tuo ambiente
      value: |
        - OS: [es. Windows 11, Ubuntu 22.04, macOS Ventura]
        - Browser: [es. Chrome 120, Firefox 121]
        - Versione Docker: [es. 24.0.7]
        - Versione Applicazione: [vedi VERSION file o /api/system/status]
      render: markdown
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Informazioni aggiuntive
      description: Qualsiasi altra informazione utile (screenshot, configurazioni, ecc.)
      placeholder: Aggiungi screenshot o altre informazioni...
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Prima di inviare, assicurati di aver fatto quanto segue
      options:
        - label: Ho cercato tra le issue esistenti per verificare che non sia già stata segnalata
          required: true
        - label: Ho verificato di utilizzare l'ultima versione disponibile
          required: true
        - label: Ho incluso tutti i dettagli necessari per riprodurre il problema
          required: true
